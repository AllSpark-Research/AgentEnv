[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navalia-harness"
version = "0.1.0"
description = "FIFO trajectory collection for Navalia-35B-A3B"
requires-python = ">=3.11"
dependencies = ["openai>=1.60,<4", "httpx>=0.27,<1", "PyYAML>=6,<7", "requests>=2.32,<3"]

[project.scripts]
navalia-collect = "navalia.run:main"

[tool.setuptools.packages.find]
include = ["navalia*"]
